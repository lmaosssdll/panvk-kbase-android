name: Build PanVK G52 glibc (Manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix apt sources for arm64 and install dependencies
        run: |
          # Исправляем ошибку 404 для arm64 пакетов на security.ubuntu.com
          sudo sed -i 's/security.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list.d/*.sources || true
          sudo sed -i 's/security.ubuntu.com/azure.archive.ubuntu.com/g' /etc/apt/sources.list || true
          
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libdrm-dev:arm64 libudev-dev:arm64 \
            libwayland-dev:arm64 wayland-protocols \
            python3-mako python3-pygments \
            libvulkan-dev:arm64 \
            libexpat1-dev:arm64 libzstd-dev:arm64 zlib1g-dev:arm64 \
            libxcb-shm0-dev:arm64 libxcb-xfixes0-dev:arm64 libxcb-randr0-dev:arm64 \
            libx11-xcb-dev:arm64 libxcb-dri2-0-dev:arm64 libxcb-dri3-dev:arm64

      - name: Create Meson cross-file
        run: |
          cat > aarch64-linux-gnu.txt << 'EOF'
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-gcc-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'pkg-config'
          
          [properties]
          needs_exe_wrapper = false
          
          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      - name: Configure Meson
        run: |
          # Собираем Vulkan-драйвер panfrost (PanVK для Bifrost/Mali-G52)
          meson setup build --cross-file aarch64-linux-gnu.txt \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers= \
            -Dplatforms= \
            -Dprefix=/usr \
            --buildtype=release

      - name: Compile
        run: |
          ninja -C build

      - name: Package artifacts
        run: |
          mkdir -p panvk-artifact/lib
          mkdir -p panvk-artifact/share/vulkan/icd.d
          
          # Копируем все собранные .so файлы
          find build -name "*.so" -exec cp {} panvk-artifact/lib/ \;
          
          # Создаем правильный ICD manifest для Linux
          echo '{
            "file_format_version": "1.0.0",
            "ICD": {
              "library_path": "/usr/lib/aarch64-linux-gnu/libvulkan_panfrost.so",
              "api_version": "1.3.0"
            }
          }' > panvk-artifact/share/vulkan/icd.d/panvk_icd.aarch64.json
          
          # Сохраняем лог сборки на случай ошибок
          cp build/meson-logs/meson-log.txt panvk-artifact/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panvk-mali-g52-glibc-real-build
          path: panvk-artifact/
